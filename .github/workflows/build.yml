name: Build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build ktlintCheck

  version-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Warn if version already tagged
        run: |
          version=$(./gradlew -q properties | grep '^version:' | cut -d' ' -f2)
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "::warning file=build.gradle.kts::Version $version is already tagged. Bump it if this PR should produce a release."
          fi

  tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(./gradlew -q properties | grep '^version:' | cut -d' ' -f2)
          echo "Version: $version"
          if [[ "$version" == *-SNAPSHOT ]]; then
            echo "Snapshot version, skipping."
            exit 0
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error file=build.gradle.kts::Version '$version' is not valid SemVer."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "Tag $version already exists, skipping."
            exit 0
          fi
          git tag "$version" "$GITHUB_SHA"
          git push origin "$version"
          prerelease=""
          [[ "$version" == *-* ]] && prerelease="--prerelease"
          gh release create "$version" --verify-tag --generate-notes $prerelease
