name: Build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build ktlintCheck

  version-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Warn if version already tagged
        run: |
          version=$(./gradlew -q properties | grep '^version:' | cut -d' ' -f2)
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "::warning file=build.gradle.kts::Version $version is already tagged. Bump it if this PR should produce a release."
          fi

  check:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Check version
        id: check
        run: |
          version=$(./gradlew -q properties | grep '^version:' | cut -d' ' -f2)
          echo "Version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-SNAPSHOT ]]; then
            echo "Snapshot version, skipping."
            exit 0
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error file=build.gradle.kts::Version '$version' is not valid SemVer."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "Tag $version already exists, skipping."
            exit 0
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: [build, check]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Publish to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          ./gradlew
          publishKotlinMultiplatformPublicationToGitHubPackagesRepository
          publishLinuxX64PublicationToGitHubPackagesRepository
          publishMacosArm64PublicationToGitHubPackagesRepository

  release:
    needs: [check, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "$VERSION"
          prerelease=""
          [[ "$VERSION" == *-* ]] && prerelease="--prerelease"
          gh release create "$VERSION" --verify-tag --generate-notes $prerelease
